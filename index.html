<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gellar.tech | Инфраструктура</title>
    <style>
        body {
            background-color: #1a1614;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }       
        h1 { color: #ffffff; font-weight: 300; letter-spacing: 2px; }
        .links { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        
        /* Стиль для рабочих кнопок (бирюзовый) */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: transparent;
            color: #00e5bc;
            border: 2px solid #00e5bc;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #00e5bc;
            color: #000000;
            box-shadow: 0 0 15px #00e5bc, 0 0 30px rgba(0, 229, 188, 0.8);
        }

        /* Стиль для кнопок "скоро" (красный, неактивный) */
        .btn-soon {
            color: #ff4d4d;
            border-color: #ff4d4d;
            pointer-events: none; /* Запрещает клик */
            cursor: not-allowed;  /* Показывает курсор "запрещено" */
        }
        .btn-soon:hover {
            background-color: transparent;
            box-shadow: none;
            color: #ff4d4d;
        }

        .status { margin-top: 40px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <h1>gellar.tech</h1>
    <p>Информационный блог и статус сервисов</p>
    
    <div class="links">
        <!-- VAULTWARDEN (Работает) -->
        <a href="https://vault.gellar.crazedns.ru" class="btn" target="_blank">хранилище паролей</a>
        
        <!-- ОБЛАКО (Скоро) -->
        <a href="#" class="btn btn-soon">облачное хранилище (скоро)</a>
        
        <!-- СБП (Скоро) -->
        <a href="#" class="btn btn-soon">админу на кофе (скоро)</a>
    </div>

    <div class="status">Статус систем: <span style="color: #00e5bc;">(скоро)</span></div>
</body>
</html>
